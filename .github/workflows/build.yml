name: Angular Build

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build Angular Project
    runs-on: ubuntu-latest

    steps:
      # 1. Obtener el código fuente del repositorio
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 2. Configurar el entorno de Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Cambia esto a la versión que use tu proyecto (ej. 18, 20)
          cache: 'npm'       # Habilita el caché de npm para optimizar tiempos

      # 3. Instalar dependencias usando el registro público de npm
      - name: Install Dependencies
        run: npm ci

      # 4. Compilar el proyecto en modo producción
      - name: Build Project
        run: npm run build -- --configuration production
